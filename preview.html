<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todos Preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <nav class="top-nav">
      <a href="index.html">홈</a>
      <a href="about.html">About</a>
      <a href="preview.html" class="active">Preview</a>
    </nav>
    <div class="card">
      <h1>test_todos 목록</h1>
      <p id="status">불러오는 중...</p>
      <ul class="todo-list" id="todo-list"></ul>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bokfhaqclubksjwarrfo.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_oCOsJOjJg3nJfBp2MaptoQ_qyBm4JNU";

    async function loadTodos() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("todo-list");

      try {
        const res = await fetch(SUPABASE_URL + "test_todos?select=*", {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY
          }
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status + " " + res.statusText);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          statusEl.textContent = "데이터가 없습니다.";
          return;
        }

        statusEl.remove();
        listEl.innerHTML = todos
          .map((todo) => {
            const doneClass = todo.done ? "done" : "";
            const badgeText = todo.done ? "완료" : "미완료";
            return (
              '<li class="' + doneClass + '">' +
                '<span class="title">' + todo.title + '</span>' +
                '<span class="meta">수량 ' + todo.amount + ' · 마감 ' + todo.due_date + '</span>' +
                '<span class="badge">' + badgeText + '</span>' +
              '</li>'
            );
          })
          .join("");
      } catch (err) {
        statusEl.textContent = "불러오기 실패: " + err.message;
      }
    }

    loadTodos();
  </script>
</body>
</html>
