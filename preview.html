<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todos Preview</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }
    li.done .title { text-decoration: line-through; color: #999; }
    .title { font-weight: bold; }
    .meta { font-size: 13px; color: #777; white-space: nowrap; }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #eee;
      color: #555;
    }
    li.done .badge { background: #d6f5d6; color: #2a7a2a; }
    #status { color: #888; }
  </style>
</head>
<body>
  <h1>test_todos 목록</h1>
  <p><a href="index.html">홈으로</a> | <a href="about.html">About</a></p>
  <p id="status">불러오는 중...</p>
  <ul id="todo-list"></ul>

  <script>
    const SUPABASE_URL = "https://bokfhaqclubksjwarrfo.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_oCOsJOjJg3nJfBp2MaptoQ_qyBm4JNU";

    async function loadTodos() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("todo-list");

      try {
        const res = await fetch(SUPABASE_URL + "test_todos?select=*", {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY
          }
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status + " " + res.statusText);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          statusEl.textContent = "데이터가 없습니다.";
          return;
        }

        statusEl.remove();
        listEl.innerHTML = todos
          .map((todo) => {
            const doneClass = todo.done ? "done" : "";
            const badgeText = todo.done ? "완료" : "미완료";
            return (
              '<li class="' + doneClass + '">' +
                '<span class="title">' + todo.title + '</span>' +
                '<span class="meta">수량 ' + todo.amount + ' · 마감 ' + todo.due_date + '</span>' +
                '<span class="badge">' + badgeText + '</span>' +
              '</li>'
            );
          })
          .join("");
      } catch (err) {
        statusEl.textContent = "불러오기 실패: " + err.message;
      }
    }

    loadTodos();
  </script>
</body>
</html>
